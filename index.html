    <script>
      /* Typewriter - types out "Erika Goh" with green accent on "Goh" */
      (function () {
        const el = document.getElementById("heroName");
        if (!el) return;
        el.innerHTML = "";
        const cursor = document.createElement("span");
        cursor.className = "type-cursor";
        el.appendChild(cursor);

        const parts = [
          { text: "Erika ", className: null },
          { text: "Goh", className: "name-accent" },
        ];
        let partIdx = 0;
        let charIdx = 0;
        let currentSpan = null;

        function step() {
          if (partIdx >= parts.length) {
            setTimeout(() => cursor.remove(), 400);
            return;
          }
          const p = parts[partIdx];
          if (charIdx === 0) {
            currentSpan = document.createElement("span");
            if (p.className) currentSpan.className = p.className;
            el.insertBefore(currentSpan, cursor);
          }
          currentSpan.textContent += p.text[charIdx];
          charIdx++;
          if (charIdx >= p.text.length) {
            partIdx++;
            charIdx = 0;
          }
          const jitter = 60 + Math.random() * 70;
          setTimeout(step, jitter);
        }

        setTimeout(step, 350);
      })();

      /* Live local time */
      (function () {
        const el = document.getElementById("localTime");
        if (!el) return;
        const fmt = new Intl.DateTimeFormat("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "America/Toronto",
          timeZoneName: "short",
        });
        const tick = () => {
          el.textContent = fmt.format(new Date()).toUpperCase();
        };
        tick();
        setInterval(tick, 15000);
      })();

      /* Portrait mouse parallax - subtle drift + tilt on the wrap */
      (function () {
        const wrap = document.querySelector(".hero-portrait-wrap");
        if (!wrap || window.matchMedia("(max-width: 1100px)").matches)
          return;
        let tx = 0,
          ty = 0,
          rx = 0,
          ry = 0;
        let targetTx = 0,
          targetTy = 0,
          targetRx = 0,
          targetRy = 0;
        window.addEventListener(
          "mousemove",
          (e) => {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const dx = (e.clientX - cx) / cx;
            const dy = (e.clientY - cy) / cy;
            targetTx = dx * 10;
            targetTy = dy * 10;
            targetRy = dx * 4;
            targetRx = -dy * 3;
          },
          { passive: true },
        );
        window.addEventListener("mouseleave", () => {
          targetTx = targetTy = targetRx = targetRy = 0;
        });
        function animate() {
          tx += (targetTx - tx) * 0.06;
          ty += (targetTy - ty) * 0.06;
          rx += (targetRx - rx) * 0.06;
          ry += (targetRy - ry) * 0.06;
          wrap.style.setProperty("--tilt-tx", tx.toFixed(2) + "px");
          wrap.style.setProperty("--tilt-ty", ty.toFixed(2) + "px");
          wrap.style.setProperty("--tilt-rx", rx.toFixed(2) + "deg");
          wrap.style.setProperty("--tilt-ry", ry.toFixed(2) + "deg");
          requestAnimationFrame(animate);
        }
        animate();
      })();
    </script>
