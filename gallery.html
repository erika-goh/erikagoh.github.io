    <canvas id="treeCanvas" aria-hidden="true"></canvas>

    <main class="content">
      <div class="content-inner wide">
        <div class="page-head reveal">
          <div class="section-label">05 .gallery()</div>
        </div>

        <section class="reveal">
          <div class="prose" style="margin-bottom: 2rem">
            <p>
              A quieter space — beyond engineering, a collection of my
              digital and traditional art.
            </p>
          </div>
          <div class="gallery-grid">
            <figure class="gallery-item">
              <div class="gallery-media">
                <img
                  src="gallery-chess.jpg"
                  alt="Graphite drawing of oversized chess pieces on a cracked board inside a gothic cathedral"
                />
              </div>
              <figcaption>Graphite · 2026</figcaption>
            </figure>
            <figure class="gallery-item">
              <div class="gallery-media">
                <img src="gallery-jaguar.jpg" alt="Pencil sketch of a roaring jaguar" />
              </div>
              <figcaption>Graphite · 2026</figcaption>
            </figure>
            <!-- TEMP: pencil pieces hidden, to be re-added later
            <figure class="gallery-item">
              <div class="gallery-media">
                <img src="gallery-img3.jpg" alt="" />
              </div>
              <figcaption>Pencil · 2024</figcaption>
            </figure>
            -->
            <figure class="gallery-item">
              <div class="gallery-media">
                <img src="gallery-strawberry.jpg" alt="Strawberry illustration" />
              </div>
              <figcaption>Digital · 2026</figcaption>
            </figure>
            <!-- TEMP: pencil pieces hidden, to be re-added later
            <figure class="gallery-item">
              <div class="gallery-media">
                <img src="gallery-img4.jpg" alt="" />
              </div>
              <figcaption>Pencil · 2021</figcaption>
            </figure>
            -->
            <figure class="gallery-item">
              <div class="gallery-media" data-placeholder="05"></div>
            </figure>
            <figure class="gallery-item">
              <div class="gallery-media" data-placeholder="06"></div>
            </figure>
          </div>
        </section>

        <footer class="foot">
          <div>© 2026 Erika Goh</div>
          <div>Last updated 07/26/2026</div>
        </footer>
      </div>

    <script src="main.js"></script>
